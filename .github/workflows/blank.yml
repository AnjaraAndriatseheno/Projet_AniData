name: CI

# ===========================================================================
# WORKFLOW CI — AniData Scraper
# ---------------------------------------------------------------------------
# Déclenché sur chaque push et PR vers la branche ethan.
#
# Jobs :
#   1. lint          → ruff sur le scraper
#   2. tests         → pytest sur Python 3.10 et 3.11
#   3. scrape        → lance le mock-site + scraper, commite le JSON dans le repo
#   4. build         → build image Docker Airflow + push sur GHCR (push seulement)
# ===========================================================================

on:
  push:
    branches: [ethan]
  pull_request:
    branches: [ethan]

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 : LINT
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installation de ruff
        run: pip install ruff

      - name: Vérification du style
        run: ruff check anidata-scraper/anidata_scraper/ anidata-scraper/tests/

  # ---------------------------------------------------------------------------
  # JOB 2 : TESTS
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r anidata-scraper/requirements-dev.txt

      - name: Exécution des tests avec couverture
        run: pytest anidata-scraper/ --cov=anidata-scraper/anidata_scraper --cov-report=term-missing --cov-report=xml

      - name: Upload du rapport de couverture (artefact)
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 3 : SCRAPING
  # Lance le mock-site + scraper, commite le JSON dans le repo.
  # Tourne uniquement si lint + tests passent.
  # ---------------------------------------------------------------------------
  scrape:
    name: Scraping
    needs: [lint, tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Démarrage du mock-site
        run: docker compose up -d mock-site

      - name: Attente que le mock-site soit prêt
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8088 && break
            echo "Attente... ($i/15)"
            sleep 2
          done

      - name: Installation de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installation des dépendances scraper
        run: |
          pip install -r anidata-scraper/requirements.txt
          pip install -e anidata-scraper/

      - name: Lancement du scraping
        run: |
          python -m anidata_scraper.scraper \
            --base-url http://localhost:8088 \
            --output-dir ./data/raw \
            -v

      - name: Commit et push du fichier JSON
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/*.json
          git diff --cached --quiet || git commit -m "data: scraping automatique $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

  # ---------------------------------------------------------------------------
  # JOB 4 : BUILD & PUSH IMAGE DOCKER AIRFLOW
  # Reconstruit l'image avec le nouveau code Python et la pousse sur GHCR.
  # Tourne uniquement sur push (pas sur les PR) et si lint + tests passent.
  # ---------------------------------------------------------------------------
  build:
    name: Build & Push Docker
    needs: [lint, tests]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}-airflow:ethan
          cache-from: type=gha
          cache-to: type=gha,mode=max
