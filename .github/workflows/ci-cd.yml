name: CI/CD

# =============================================================================
# WORKFLOW CI/CD COMPLET — AniData
# -----------------------------------------------------------------------------
# Déclenché sur chaque push et PR vers main.
#
# Stratégie GitFlow light :
#   feature/* → dev  (blank.yml : lint + tests seulement)
#   dev       → main (ce fichier : lint + tests + build Docker + push GHCR)
#
# Jobs :
#   1. lint          → ruff sur le scraper
#   2. tests         → pytest sur Python 3.10 et 3.11
#   3. build-and-push → image Docker Airflow custom publiée sur GHCR
#      (uniquement si lint + tests passent, et uniquement sur push vers main)
# =============================================================================

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

# Permissions nécessaires pour pousser sur GHCR avec le GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — LINT
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installation de ruff
        run: pip install ruff

      - name: Vérification du style
        run: ruff check anidata-scraper/anidata_scraper/ anidata-scraper/tests/

  # ---------------------------------------------------------------------------
  # JOB 2 — TESTS
  # Matrice Python 3.10 + 3.11 pour valider la compatibilité
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false permet de voir les résultats sur toutes les versions
      # même si l'une d'elles échoue
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r anidata-scraper/requirements-dev.txt

      - name: Lancement des tests avec couverture
        run: |
          pytest anidata-scraper/ \
            --cov=anidata-scraper/anidata_scraper \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Sauvegarde du rapport de couverture
        # Uniquement sur Python 3.10 pour éviter les doublons
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # JOB 3 — BUILD & PUSH IMAGE DOCKER
  # Ne tourne QUE si lint + tests passent (needs).
  # Sur les PR : build uniquement (pas de push) pour valider le Dockerfile.
  # Sur push main ou tag : build + push vers GHCR.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker
    needs: [lint, tests]
    runs-on: ubuntu-latest

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}-airflow

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        # Pas de connexion sur les PR (on ne pousse pas)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Génération des tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag latest sur les push vers main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # Tag avec le SHA court du commit (toujours présent)
            type=sha,prefix=sha-,format=short
            # Tags versionnés sur les tags vX.Y.Z
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build et push de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          # Push uniquement hors Pull Request
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache GitHub Actions pour accélérer les builds suivants
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé du déploiement
        if: github.event_name != 'pull_request'
        run: |
          echo "## Image publiée sur GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags déployés :**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pour pull localement :" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
